name: Build Resume and Deploy

on:
  push:
    paths:
      - 'raw/**'
      - 'build_resume.py'
      - 'template.tex'
      - '.github/workflows/build-resume.yml'
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-fonts-extra

      - name: Install Python dependencies
        run: |
          pip install pypandoc

      - name: Find latest resume markdown
        id: find-resume
        run: |
          # Do not use `ls -t`. After a checkout every file can share one
          # mtime, and that sort is then arbitrary.
          LATEST_MD=$(python build_resume.py --latest raw)
          echo "resume_file=$LATEST_MD" >> "$GITHUB_OUTPUT"
          echo "Found resume: $LATEST_MD"

      - name: Build resume PDF
        run: |
          python build_resume.py "${{ steps.find-resume.outputs.resume_file }}" raw/Portrait.jpg

      - name: Rename PDF with date
        id: dated-pdf
        run: |
          DATE=$(date +%Y-%m-%d)
          DATED="pdf/Micah_Longmire-${DATE}.pdf"
          cp pdf/resume.pdf "$DATED"
          echo "dated_pdf=$DATED" >> "$GITHUB_OUTPUT"

      - name: Update docs PDFs for GitHub Pages
        run: |
          # docs/index.html is the hand-built portfolio page. This workflow
          # used to overwrite it with an old gradient template. Only refresh
          # the PDFs that page already links to (docs/resume.pdf).
          mkdir -p docs
          cp pdf/resume.pdf docs/resume.pdf
          cp "${{ steps.dated-pdf.outputs.dated_pdf }}" docs/

      - name: Commit and push PDF updates
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add pdf/resume.pdf pdf/Micah_Longmire-*.pdf docs/resume.pdf docs/Micah_Longmire-*.pdf
          git diff --staged --quiet || git commit -m "Auto-generate resume PDF and update GitHub Pages"
          git push
